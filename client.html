<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>AutoPilot — Личный кабинет</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #060A12;
  --sf: #0C1220;
  --card: #101828;
  --bd: rgba(255, 255, 255, .06);
  --bd2: rgba(255, 255, 255, .11);
  --blue: #3B82F6;
  --bla15: rgba(59, 130, 246, .15);
  --bla08: rgba(59, 130, 246, .08);
  --txt: #F1F5F9;
  --sub: #94A3B8;
  --hint: #475569;
  --green: #10B981;
  --amber: #F59E0B;
  --red: #EF4444;
  --orange: #F97316;
}

html {
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
}

h1, h2, h3, h4 {
  font-family: 'Syne', sans-serif;
}

button, input, select, textarea {
  font-family: inherit;
  cursor: pointer;
}

/* сетка фона */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image: linear-gradient(rgba(59, 130, 246, .025) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(59, 130, 246, .025) 1px, transparent 1px);
  background-size: 64px 64px;
}

nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  height: 64px;
  display: flex;
  align-items: center;
  padding: 0 1.5rem;
  gap: 14px;
  backdrop-filter: blur(24px);
  background: rgba(6, 10, 18, .9);
  border-bottom: .5px solid var(--bd);
}

.logo {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -.5px;
  color: var(--txt);
  text-decoration: none;
}

.logo em {
  color: var(--blue);
  font-style: normal;
}

.ldot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: blink 2s infinite;
  display: inline-block;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: .35; }
}

.nav-r {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.uname {
  font-size: 14px;
  color: var(--sub);
}

.av {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3B82F6, #8B5CF6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  font-family: 'Syne', sans-serif;
}

.layout {
  display: flex;
  padding-top: 64px;
  min-height: 100vh;
}

.sb {
  width: 220px;
  border-right: .5px solid var(--bd);
  padding: 24px 16px;
  position: fixed;
  top: 64px;
  bottom: 0;
  background: var(--sf);
  z-index: 50;
  overflow-y: auto;
}

.ct {
  flex: 1;
  margin-left: 220px;
  padding: 32px 24px;
  position: relative;
  z-index: 1;
}

.ni {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 14px;
  color: var(--sub);
  transition: all .2s;
  margin-bottom: 4px;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}

.ni:hover {
  background: rgba(255, 255, 255, .04);
  color: var(--txt);
}

.ni.on {
  background: var(--bla15);
  color: var(--txt);
}

.ndiv {
  height: .5px;
  background: var(--bd);
  margin: 12px 0;
}

.ph {
  margin-bottom: 28px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.ph h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -.5px;
}

.ph p {
  font-size: 14px;
  color: var(--sub);
  margin-top: 6px;
  font-weight: 300;
}

.card {
  background: var(--card);
  border: .5px solid var(--bd);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
}

.sgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}

.sc {
  background: var(--sf);
  border: .5px solid var(--bd);
  border-radius: 12px;
  padding: 18px;
}

.sc .n {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 700;
}

.sc .l {
  font-size: 12px;
  color: var(--hint);
  margin-top: 4px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  border: none;
  transition: all .2s;
}

.btn-p {
  background: var(--blue);
  color: #fff;
}

.btn-p:hover {
  background: #2563EB;
}

.btn-g {
  background: transparent;
  border: .5px solid var(--bd2);
  color: var(--sub);
}

.btn-g:hover {
  border-color: var(--blue);
  color: var(--txt);
  background: var(--bla08);
}

.btn-sm {
  padding: 6px 14px;
  font-size: 13px;
  border-radius: 8px;
}

.sbadge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
}

.s-new { background: rgba(148, 163, 184, .15); color: #94A3B8; }
.s-accepted { background: var(--bla15); color: #93C5FD; }
.s-diag { background: rgba(139, 92, 246, .15); color: #C4B5FD; }
.s-repair { background: rgba(249, 115, 22, .15); color: #FCA5A1; }
.s-done { background: rgba(16, 185, 129, .15); color: #6EE7B7; }
.s-cancelled { background: rgba(148, 163, 184, .1); color: #64748B; }

.stepper {
  display: flex;
  align-items: flex-start;
  position: relative;
  margin: 20px 0;
}

.si {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.si:not(:last-child)::after {
  content: '';
  position: absolute;
  top: 15px;
  left: calc(50% + 16px);
  width: calc(100% - 32px);
  height: 2px;
  background: var(--bd2);
  z-index: 0;
}

.si.done::after {
  background: var(--blue);
}

.sdot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  z-index: 1;
  border: 2px solid var(--bd2);
  background: var(--card);
  color: var(--hint);
  position: relative;
  transition: all .35s;
}

.si.done .sdot {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}

.si.active .sdot {
  border-color: var(--orange);
  color: var(--orange);
  animation: pr 1.6s infinite;
}

@keyframes pr {
  0%, 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, .45); }
  50% { box-shadow: 0 0 0 8px rgba(249, 115, 22, 0); }
}

.slabel {
  margin-top: 8px;
  text-align: center;
  font-size: 11px;
  color: var(--hint);
  line-height: 1.4;
}

.si.done .slabel,
.si.active .slabel {
  color: var(--txt);
}

.pbar {
  height: 4px;
  background: var(--bd);
  border-radius: 2px;
  margin: 12px 0;
  overflow: hidden;
}

.pbf {
  height: 100%;
  background: var(--blue);
  border-radius: 2px;
  transition: width .6s ease;
}

.mbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  background: rgba(255, 255, 255, .02);
  border: .5px solid var(--bd);
  border-radius: 12px;
  margin-top: 20px;
}

.mav {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3B82F6, #8B5CF6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}

.minfo p:first-child {
  font-size: 14px;
  font-weight: 500;
}

.minfo p:last-child {
  font-size: 12px;
  color: var(--hint);
}

.etab {
  margin-left: auto;
  background: rgba(16, 185, 129, .1);
  border: .5px solid rgba(16, 185, 129, .3);
  color: #34D399;
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 13px;
  white-space: nowrap;
}

.qgrid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 16px;
}

.qbtn {
  padding: 12px 14px;
  border-radius: 10px;
  background: rgba(255, 255, 255, .025);
  border: .5px solid var(--bd2);
  color: var(--sub);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
  text-align: left;
}

.qbtn:hover {
  background: var(--bla08);
  border-color: rgba(59, 130, 246, .4);
  color: var(--txt);
}

.qresp {
  padding: 14px 16px;
  background: var(--bla08);
  border: .5px solid rgba(59, 130, 246, .2);
  border-radius: 12px;
  font-size: 14px;
  color: var(--sub);
  line-height: 1.65;
  margin-top: 14px;
  animation: fadein .25s ease;
}

@keyframes fadein {
  from { opacity: 0; }
  to { opacity: 1; }
}

.ri {
  padding: 16px 0;
  border-bottom: .5px solid var(--bd);
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: opacity .2s;
}

.ri:last-child {
  border-bottom: none;
}

.ri:hover {
  opacity: .8;
}

.ric {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: var(--bla15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.rim {
  flex: 1;
  min-width: 0;
}

.rim h4 {
  font-size: 15px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rim p {
  font-size: 12px;
  color: var(--hint);
  margin-top: 3px;
}

.rir {
  text-align: right;
  flex-shrink: 0;
}

.rir .dt {
  font-size: 12px;
  color: var(--hint);
  margin-top: 3px;
}

.ni-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 0;
  border-bottom: .5px solid var(--bd);
}

.ni-item:last-child {
  border-bottom: none;
}

.ni-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.ni-body {
  flex: 1;
}

.ni-body p:first-child {
  font-size: 14px;
  font-weight: 500;
}

.ni-body p:last-child {
  font-size: 12px;
  color: var(--hint);
  margin-top: 3px;
}

.ndot2 {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--blue);
  margin-top: 4px;
  flex-shrink: 0;
}

.fg {
  margin-bottom: 16px;
}

.fl {
  font-size: 13px;
  color: var(--sub);
  margin-bottom: 6px;
  display: block;
}

.inp {
  width: 100%;
  padding: 11px 14px;
  background: var(--sf);
  border: .5px solid var(--bd2);
  border-radius: 10px;
  color: var(--txt);
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
}

.inp:focus {
  border-color: var(--blue);
}

.inp::placeholder {
  color: var(--hint);
}

select.inp {
  appearance: none;
  cursor: pointer;
}

textarea.inp {
  resize: vertical;
  min-height: 100px;
}

.frow {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .75);
  backdrop-filter: blur(10px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.overlay.open {
  display: flex;
  animation: fadein .2s ease;
}

.modal {
  background: var(--card);
  border: .5px solid var(--bd2);
  border-radius: 20px;
  padding: 32px;
  width: 100%;
  max-width: 520px;
  position: relative;
  animation: su .3s ease;
  max-height: 90vh;
  overflow-y: auto;
}

@keyframes su {
  from { transform: translateY(18px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.mx {
  position: absolute;
  top: 18px;
  right: 18px;
  background: none;
  border: none;
  color: var(--hint);
  font-size: 18px;
  padding: 4px;
  cursor: pointer;
  line-height: 1;
}

.mx:hover {
  color: var(--txt);
}

.modal h2 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}

.modal .sub {
  font-size: 14px;
  color: var(--sub);
  margin-bottom: 24px;
  font-weight: 300;
}

.empty {
  text-align: center;
  padding: 60px 20px;
}

.empty-i {
  font-size: 52px;
  margin-bottom: 16px;
  opacity: .35;
}

.empty h3 {
  font-size: 18px;
  margin-bottom: 8px;
  color: var(--sub);
}

.empty p {
  font-size: 14px;
  color: var(--hint);
}

.loader {
  display: flex;
  justify-content: center;
  padding: 60px;
}

.spin {
  width: 32px;
  height: 32px;
  border: 2px solid var(--bd2);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: sp .7s linear infinite;
}

@keyframes sp {
  to { transform: rotate(360deg); }
}

.toast-c {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  background: var(--card);
  border: .5px solid var(--bd2);
  border-radius: 14px;
  padding: 13px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  min-width: 260px;
  pointer-events: auto;
  transform: translateX(110%);
  transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), opacity .3s;
  opacity: 0;
}

.toast.show {
  transform: none;
  opacity: 1;
}

.toast-s { border-color: rgba(16, 185, 129, .35); }
.toast-e { border-color: rgba(239, 68, 68, .35); }
.toast-i { border-color: rgba(59, 130, 246, .35); }

@media (max-width: 768px) {
  .sb { display: none; }
  .ct { margin-left: 0; }
  .frow { grid-template-columns: 1fr; }
  .qgrid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">Auto<em>Pilot</em></a>
  <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)"><span class="ldot"></span>Live</div>
  <div class="nav-r">
    <span class="uname" id="uname"></span>
    <div class="av" id="uav"></div>
  </div>
</nav>
<div class="layout">
  <div class="sb">
    <button class="ni on" id="nD" onclick="pg('dash')"><span style="font-size:16px;width:20px;text-align:center">🏠</span>Главная</button>
    <button class="ni" id="nR" onclick="pg('reqs')"><span style="font-size:16px;width:20px;text-align:center">📋</span>Мои заявки</button>
    <button class="ni" id="nN" onclick="pg('new')"><span style="font-size:16px;width:20px;text-align:center">➕</span>Новая заявка</button>
    <button class="ni" id="nNt" onclick="pg('notif')"><span style="font-size:16px;width:20px;text-align:center">🔔</span>Уведомления<span id="ubadge" style="display:none;background:var(--blue);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:4px"></span></button>
    <div class="ndiv"></div>
    <button class="ni" id="nP" onclick="pg('prof')"><span style="font-size:16px;width:20px;text-align:center">👤</span>Профиль</button>
    <button class="ni" onclick="logout()"><span style="font-size:16px;width:20px;text-align:center">🚪</span>Выйти</button>
  </div>
  <div class="ct">

    <!-- DASHBOARD -->
    <div id="pgDash">
      <div class="ph">
        <div><h1 id="greet">Добрый день!</h1><p>Состояние вашей техники</p></div>
        <button class="btn btn-p" onclick="pg('new')">➕ Новая заявка</button>
      </div>
      <div class="sgrid">
        <div class="sc"><div class="n" id="stAll">—</div><div class="l">Всего заявок</div></div>
        <div class="sc"><div class="n" style="color:var(--orange)" id="stAct">—</div><div class="l">В работе</div></div>
        <div class="sc"><div class="n" style="color:var(--green)" id="stDn">—</div><div class="l">Завершено</div></div>
      </div>
      <div id="activeWrap"></div>
    </div>

    <!-- REQUESTS -->
    <div id="pgReqs" style="display:none">
      <div class="ph">
        <div><h1>Мои заявки</h1><p>История всех обращений</p></div>
        <button class="btn btn-p" onclick="pg('new')">➕ Новая заявка</button>
      </div>
      <div class="card" id="reqsBody"></div>
    </div>

    <!-- NEW REQUEST -->
    <div id="pgNew" style="display:none">
      <div class="ph"><div><h1>Новая заявка</h1><p>Опишите проблему — мы займёмся ею</p></div></div>
      <div class="card" style="max-width:600px">
        <div class="frow">
          <div class="fg"><label class="fl">Марка *</label>
            <select class="inp" id="nMake">
              <option value="">Выберите</option>
              <option>Caterpillar</option><option>Komatsu</option><option>Volvo</option>
              <option>Hitachi</option><option>Liebherr</option><option>XCMG</option>
              <option>Sany</option><option>Zoomlion</option><option>Тонар</option>
              <option>КАЗ</option><option>ТВЭКС</option><option>ЧТЗ-Уралтрак</option><option>Другое</option>
            </select>
          </div>
          <div class="fg"><label class="fl">Модель *</label><input class="inp" id="nModel" type="text" placeholder="Экскаватор, погрузчик..."></div>
        </div>
        <div class="frow">
          <div class="fg"><label class="fl">Год *</label><input class="inp" id="nYear" type="number" placeholder="2020" min="1980" max="2026"></div>
          <div class="fg"><label class="fl">Гос. номер</label><input class="inp" id="nPlate" type="text" placeholder="А123БВ77"></div>
        </div>
        <div class="fg"><label class="fl">Описание проблемы *</label><textarea class="inp" id="nDesc" placeholder="Подробно опишите, что происходит с техникой..."></textarea></div>
        <div class="frow">
          <div class="fg"><label class="fl">Желаемая дата</label><input class="inp" id="nDate" type="date"></div>
          <div class="fg"><label class="fl">Телефон</label><input class="inp" id="nPhone" type="tel" placeholder="+7 (999) 999-99-99"></div>
        </div>
        <div id="nErr" style="color:#F87171;font-size:13px;margin-bottom:12px;display:none"></div>
        <button class="btn btn-p" id="nBtn" onclick="createReq()">Создать заявку</button>
      </div>
    </div>

    <!-- NOTIFICATIONS -->
    <div id="pgNotif" style="display:none">
      <div class="ph">
        <div><h1>Уведомления</h1><p>Обновления по вашим заявкам</p></div>
        <button class="btn btn-g btn-sm" onclick="readAll()">Отметить всё прочитанным</button>
      </div>
      <div class="card" id="notifBody"></div>
    </div>

    <!-- PROFILE -->
    <div id="pgProf" style="display:none">
      <div class="ph"><div><h1>Профиль</h1><p>Ваши данные</p></div></div>
      <div class="card" style="max-width:500px">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px;padding-bottom:24px;border-bottom:.5px solid var(--bd)">
          <div class="mav" style="width:56px;height:56px;font-size:18px" id="pAv"></div>
          <div><div style="font-size:18px;font-weight:700" id="pName"></div><div style="font-size:13px;color:var(--hint)" id="pEmail"></div></div>
        </div>
        <div class="fg"><label class="fl">Имя</label><input class="inp" id="eName" type="text"></div>
        <div class="fg"><label class="fl">Телефон</label><input class="inp" id="ePhone" type="tel" placeholder="+7 (999) 999-99-99"></div>
        <div class="fg"><label class="fl">Email (нельзя изменить)</label><input class="inp" id="eEmail" type="email" disabled style="opacity:.5"></div>
        <div style="height:.5px;background:var(--bd);margin:20px 0"></div>
        <div style="font-size:13px;font-weight:500;margin-bottom:14px;color:var(--sub)">Смена пароля (необязательно)</div>
        <div class="fg"><label class="fl">Новый пароль</label><input class="inp" id="ePass" type="password" placeholder="Минимум 6 символов"></div>
        <button class="btn btn-p" onclick="saveProf()">Сохранить изменения</button>
      </div>
    </div>

  </div>
</div>

<!-- DETAIL MODAL -->
<div class="overlay" id="dtOv">
  <div class="modal" style="max-width:600px">
    <button class="mx" onclick="closeOv('dtOv')">✕</button>
    <div id="dtBody"></div>
  </div>
</div>

<div class="toast-c" id="tc"></div>

<script>
// ----- СТАТУСЫ И КОНСТАНТЫ -----
const STATUS = {
  new:      { l: 'Заявка создана',  c: 's-new',      i: '🟡', s: 0, p: 5 },
  accepted: { l: 'Техника принято',    c: 's-accepted', i: '🔵', s: 1, p: 25 },
  diag:     { l: 'Диагностика',     c: 's-diag',     i: '🟣', s: 2, p: 50 },
  repair:   { l: 'Ремонт',          c: 's-repair',   i: '🟠', s: 3, p: 75 },
  done:     { l: 'Готово',          c: 's-done',     i: '🟢', s: 4, p: 100 },
  cancelled:{ l: 'Отменена',        c: 's-cancelled',i: '⚪', s: -1, p: 0 },
};
const STEPS = ['Заявка создана', 'Техника принято', 'Диагностика', 'Ремонт', 'Готово'];
const QA = {
  time:  'Время готовности отображается в строке <strong>«Осталось»</strong> карточки. Уточняйте у механика при смене статуса.',
  price: 'Предварительная стоимость указана в карточке. Точная сумма согласовывается после диагностики.',
  call:  '📞 <strong>+7 (3852) XX-XX-XX</strong> — Пн–Пт 8:00–19:00, Сб 9:00–17:00',
};

// ----- ГЛОБАЛЬНЫЕ ДАННЫЕ -----
let ME = {};          // пользователь
let reqs = [];        // заявки
let notifs = [];      // уведомления

// ----- API helper (единая точка) -----
async function api(url, opts = {}) {
  const res = await fetch(url, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (res.status === 401) {
    // сессия истекла → редирект на страницу входа
    location.href = 'index.html';
    return Promise.reject(new Error('Сессия истекла'));
  }
  if (!res.ok) {
    const errorText = await res.text();
    throw new Error(`Ошибка ${res.status}: ${errorText.slice(0, 100)}`);
  }
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Ошибка сервера');
  return json.data;
}

// ----- ЗАГРУЗКА ДАННЫХ -----
async function loadReqs() {
  reqs = await api('api/requests.php?action=list');
}
async function loadNotifs() {
  const r = await api('api/requests.php?action=notifications');
  notifs = r.items || [];
  renderNotifBadge(r.unread);
}
function renderNotifBadge(unreadCount) {
  const cnt = (unreadCount !== undefined) ? unreadCount : notifs.filter(n => !n.is_read).length;
  const badge = document.getElementById('ubadge');
  if (cnt > 0) {
    badge.style.display = 'inline';
    badge.textContent = cnt;
  } else {
    badge.style.display = 'none';
  }
}

// ----- ОТРИСОВКА ДАШБОРДА -----
function renderDash() {
  const total = reqs.length;
  const doneCount = reqs.filter(r => r.status === 'done').length;
  const inWorkCount = reqs.filter(r => ['accepted', 'diag', 'repair'].includes(r.status)).length;
  const activeReq = reqs.find(r => r.status !== 'done' && r.status !== 'cancelled');

  document.getElementById('stAll').textContent = total;
  document.getElementById('stAct').textContent = inWorkCount + (activeReq && activeReq.status === 'new' ? 1 : 0);
  document.getElementById('stDn').textContent = doneCount;

  const wrap = document.getElementById('activeWrap');
  if (activeReq) {
    const st = STATUS[activeReq.status] || STATUS.new;
    wrap.innerHTML = `
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px">
          <div><h3 style="font-size:16px;font-weight:700">Активная заявка</h3><p style="font-size:12px;color:var(--hint);margin-top:3px">Обновляется каждые 10 сек</p></div>
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)"><span class="ldot"></span>Live</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:.5px solid var(--bd);margin-bottom:8px;flex-wrap:wrap;gap:10px">
          <div>
            <div style="font-size:17px;font-weight:700">${escapeHtml(activeReq.make)} ${escapeHtml(activeReq.model)} ${activeReq.year}</div>
            <div style="font-size:13px;color:var(--hint);margin-top:3px">Заявка #${activeReq.number}</div>
          </div>
          <div class="sbadge ${st.c}">${st.i} ${st.l}</div>
        </div>
        <div class="pbar"><div class="pbf" style="width:${st.p}%"></div></div>
        <div class="stepper">${buildStepStepper(st.s)}</div>
        <div class="mbar">
          <div class="mav">${activeReq.mechanic_initials || '?'}</div>
          <div class="minfo">
            <p>${activeReq.mechanic_name || 'Будет назначен'}</p>
            <p>Механик</p>
          </div>
          <div class="etab">${activeReq.status === 'stored' ? 'На хранении до ' + (activeReq.stored_until || '—') : (activeReq.eta || 'Уточняется')}</div>
        </div>
        <div class="qgrid">
          <button class="qbtn" onclick="showQA('time')">⏰ Когда будет готово?</button>
          <button class="qbtn" onclick="showQA('price')">💰 Сколько будет стоить?</button>
          <button class="qbtn" onclick="showQA('call')">📞 Позвонить в сервис</button>
          <button class="qbtn" onclick="extendStorage(${activeReq.id})">🗓 Продлить хранение +3 дня</button>
        </div>
        <div id="qaR" style="display:none" class="qresp"></div>
        ${activeReq.estimated_cost ? `<div style="margin-top:14px;padding:12px 16px;background:var(--sf);border-radius:10px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:var(--hint)">Стоимость</span><span style="font-size:16px;font-weight:700">${escapeHtml(activeReq.estimated_cost)}</span></div>` : ''}
      </div>`;
  } else {
    wrap.innerHTML = `<div class="card"><div class="empty"><div class="empty-i">🚗</div><h3>Нет активных заявок</h3><p>Ваша техника в порядке!</p><button class="btn btn-p" style="margin-top:20px" onclick="pg('new')">Записаться на ТО</button></div></div>`;
  }
}

function buildStepStepper(curStep) {
  return STEPS.map((label, idx) => {
    let statusClass = '';
    if (idx < curStep) statusClass = 'done';
    else if (idx === curStep) statusClass = 'active';
    const marker = (idx < curStep) ? '✓' : (idx + 1);
    return `<div class="si ${statusClass}"><div class="sdot">${marker}</div><div class="slabel">${label.replace(' ', '<br>')}</div></div>`;
  }).join('');
}

function showQA(key) {
  const qaDiv = document.getElementById('qaR');
  if (qaDiv) {
    qaDiv.innerHTML = QA[key];
    qaDiv.style.display = 'block';
  }
}

// ----- СПИСОК ЗАЯВОК -----
function renderReqs() {
  const container = document.getElementById('reqsBody');
  if (!reqs.length) {
    container.innerHTML = '<div class="empty"><div class="empty-i">📋</div><h3>Заявок пока нет</h3><p>Создайте первую заявку</p></div>';
    return;
  }
  container.innerHTML = reqs.map(r => {
    const st = STATUS[r.status] || STATUS.new;
    const shortDesc = (r.description || '').slice(0, 50) + ((r.description || '').length > 50 ? '...' : '');
    return `<div class="ri" onclick="showDetail(${r.id})">
      <div class="ric">🚗</div>
      <div class="rim">
        <h4>${escapeHtml(r.make)} ${escapeHtml(r.model)} ${r.year}</h4>
        <p>#${r.number} · ${escapeHtml(shortDesc)}</p>
      </div>
      <div class="rir">
        <div class="sbadge ${st.c}">${st.i} ${st.l}</div>
        <div class="dt">${formatDate(r.created_at)}</div>
      </div>
    </div>`;
  }).join('');
}

async function showDetail(id) {
  try {
    const r = await api(`api/requests.php?action=get&id=${id}`);
    const st = STATUS[r.status] || STATUS.new;
    document.getElementById('dtBody').innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
        <div><h2 style="font-size:20px">${escapeHtml(r.make)} ${escapeHtml(r.model)} ${r.year}</h2><p style="font-size:13px;color:var(--hint);margin-top:3px">Заявка #${r.number} · ${formatDate(r.created_at)}</p></div>
        <div class="sbadge ${st.c}">${st.i} ${st.l}</div>
      </div>
      <div style="padding:14px;background:var(--sf);border-radius:10px;margin-bottom:20px;font-size:14px;color:var(--sub);line-height:1.6">${escapeHtml(r.description)}</div>
      <div class="stepper">${buildStepStepper(st.s)}</div>
      <div class="mbar" style="margin-top:0;margin-bottom:16px">
        <div class="mav">${r.mechanic_initials || '?'}</div>
        <div class="minfo"><p>${r.mechanic_name || 'Будет назначен'}</p><p>Механик</p></div>
        <div class="etab">${r.eta || 'Уточняется'}</div>
      </div>
      ${r.estimated_cost ? `<div style="display:flex;justify-content:space-between;padding:12px 16px;background:var(--sf);border-radius:10px;margin-bottom:16px"><span style="font-size:13px;color:var(--hint)">Стоимость</span><span style="font-size:16px;font-weight:700">${escapeHtml(r.estimated_cost)}</span></div>` : ''}
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-p btn-sm" onclick="closeOv('dtOv');pg('new')">Записаться снова</button>
        <button class="btn btn-g btn-sm" onclick="closeOv('dtOv')">Закрыть</button>
      </div>`;
    document.getElementById('dtOv').classList.add('open');
  } catch (err) {
    Toast.error('Не удалось загрузить детали');
  }
}

// ----- УВЕДОМЛЕНИЯ -----
function renderNotifs() {
  const el = document.getElementById('notifBody');
  if (!notifs.length) {
    el.innerHTML = '<div class="empty"><div class="empty-i">🔔</div><h3>Уведомлений нет</h3></div>';
    return;
  }
  el.innerHTML = notifs.map(n => `
    <div class="ni-item">
      <div class="ni-icon" style="background:${n.is_read ? 'rgba(255,255,255,.03)' : 'var(--bla15)'}">🔔</div>
      <div class="ni-body"><p>${escapeHtml(n.title)}</p><p>${escapeHtml(n.message)} · ${formatDate(n.created_at)}</p></div>
      ${!n.is_read ? '<div class="ndot2"></div>' : ''}
    </div>
  `).join('');
}

async function readAll() {
  try {
    await api('api/requests.php?action=read_notifications', { method: 'POST', body: JSON.stringify({}) });
    await loadNotifs();     // свежие данные с сервера
    renderNotifs();
    renderNotifBadge(0);
    Toast.success('Все уведомления отмечены прочитанными');
  } catch (e) {
    Toast.error(e.message);
  }
}

// ----- ПРОФИЛЬ -----
async function saveProf() {
  const name = document.getElementById('eName').value.trim();
  const phone = document.getElementById('ePhone').value.trim();
  const newPass = document.getElementById('ePass').value;
  const payload = { name, phone };
  if (newPass) payload.new_password = newPass;
  try {
    const updated = await api('api/auth.php?action=update', { method: 'POST', body: JSON.stringify(payload) });
    ME.name = updated.name;
    ME.phone = updated.phone;
    ME.initials = updated.initials;
    applyUserData();
    Toast.success('Профиль обновлён');
    document.getElementById('ePass').value = '';
  } catch (err) {
    Toast.error(err.message);
  }
}

// ----- СОЗДАНИЕ ЗАЯВКИ -----
async function createReq() {
  const make = document.getElementById('nMake').value;
  const model = document.getElementById('nModel').value.trim();
  const year = parseInt(document.getElementById('nYear').value);
  const desc = document.getElementById('nDesc').value.trim();
  const errDiv = document.getElementById('nErr');
  errDiv.style.display = 'none';

  if (!make || !model || !year || !desc) {
    errDiv.textContent = 'Заполните обязательные поля (*)';
    errDiv.style.display = 'block';
    return;
  }
  if (year < 1980 || year > 2026) {
    errDiv.textContent = 'Некорректный год выпуска';
    errDiv.style.display = 'block';
    return;
  }

  const btn = document.getElementById('nBtn');
  const originalText = btn.textContent;
  btn.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .65s linear infinite;vertical-align:middle"></span>';
  btn.disabled = true;

  try {
    const result = await api('api/requests.php?action=create', {
      method: 'POST',
      body: JSON.stringify({
        make, model, year,
        description: desc,
        preferred_date: document.getElementById('nDate').value || null,
        phone: document.getElementById('nPhone').value.trim(),
        plate: document.getElementById('nPlate').value.trim(),
      }),
    });
    Toast.success(`Заявка #${result.number} успешно создана!`);
    await loadReqs();          // Ждём обновления списка
    pg('dash');               // Переход на главную с актуальными данными
    // Очистка формы
    document.getElementById('nMake').value = '';
    document.getElementById('nModel').value = '';
    document.getElementById('nYear').value = '';
    document.getElementById('nPlate').value = '';
    document.getElementById('nDesc').value = '';
    document.getElementById('nPhone').value = '';
    const dateInput = document.getElementById('nDate');
    if (dateInput) {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      dateInput.value = tomorrow.toISOString().split('T')[0];
    }
  } catch (err) {
    errDiv.textContent = err.message;
    errDiv.style.display = 'block';
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

// ----- ПРОДЛЕНИЕ ХРАНЕНИЯ -----
async function extendStorage(reqId) {
  if (!confirm('Продлить хранение техники на 3 дня?')) return;
  try {
    const data = await api('api/requests.php?action=extend_storage', {
      method: 'POST',
      body: JSON.stringify({ id: reqId, note: 'Клиент запросил продление через личный кабинет' })
    });
    Toast.success(`Хранение продлено до ${data.new_date}. Механик уведомлён.`);
    await loadReqs();
    renderDash();
  } catch (e) {
    Toast.error(e.message);
  }
}

// ----- НАВИГАЦИЯ -----
function pg(pageId) {
  const pages = { dash: 'pgDash', reqs: 'pgReqs', new: 'pgNew', notif: 'pgNotif', prof: 'pgProf' };
  const navBtns = { dash: 'nD', reqs: 'nR', new: 'nN', notif: 'nNt', prof: 'nP' };
  Object.entries(pages).forEach(([key, elId]) => {
    document.getElementById(elId).style.display = (key === pageId) ? 'block' : 'none';
  });
  Object.entries(navBtns).forEach(([key, btnId]) => {
    const btn = document.getElementById(btnId);
    if (btn) btn.classList.toggle('on', key === pageId);
  });

  if (pageId === 'reqs') renderReqs();
  if (pageId === 'notif') renderNotifs();
  if (pageId === 'new') {
    const t = new Date();
    t.setDate(t.getDate() + 1);
    const dateField = document.getElementById('nDate');
    if (dateField) dateField.value = t.toISOString().split('T')[0];
  }
  window.scrollTo(0, 0);
}

// ----- ОБЩИЕ УТИЛИТЫ -----
function applyUserData() {
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Доброе утро' : (hour < 18 ? 'Добрый день' : 'Добрый вечер');
  const firstName = (ME.name || '').split(' ')[0];
  document.getElementById('greet').textContent = `${greet}, ${firstName || 'гость'}!`;
  document.getElementById('uname').textContent = ME.name || '';
  document.getElementById('uav').textContent = ME.initials || '?';
  document.getElementById('pAv').textContent = ME.initials || '?';
  document.getElementById('pName').textContent = ME.name || '';
  document.getElementById('pEmail').textContent = ME.email || '';
  document.getElementById('eName').value = ME.name || '';
  document.getElementById('ePhone').value = ME.phone || '';
  document.getElementById('eEmail').value = ME.email || '';
}

function formatDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
    return c;
  });
}

function closeOv(id) {
  document.getElementById(id).classList.remove('open');
}
document.querySelectorAll('.overlay').forEach(el => {
  el.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });
});

// ----- TOAST УВЕДОМЛЕНИЯ -----
const Toast = {
  show(msg, type = 's') {
    const container = document.getElementById('tc');
    const toast = document.createElement('div');
    const icon = { s: '✓', e: '✕', i: 'ℹ' }[type] || '•';
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 350);
    }, 4000);
  },
  success: (m) => Toast.show(m, 's'),
  error: (m) => Toast.show(m, 'e'),
  info: (m) => Toast.show(m, 'i')
};

// ----- АВТОРИЗАЦИЯ И ЗАПУСК -----
async function boot() {
  let userData;
  try {
    const resp = await fetch('api/auth.php?action=me', {
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' }
    });
    if (resp.status === 401) {
      location.href = 'index.html';
      return;
    }
    const contentType = resp.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      showFatalError('Сервер вернул некорректный ответ. Проверьте настройки XAMPP (Apache + MySQL).');
      return;
    }
    const json = await resp.json();
    if (!json.ok) {
      if (resp.status === 401) location.href = 'index.html';
      else showFatalError(json.error || 'Ошибка загрузки профиля');
      return;
    }
    userData = json.data;
  } catch (err) {
    showFatalError('Не удалось подключиться к серверу. Убедитесь, что Apache запущен.');
    return;
  }

  ME = userData;
  applyUserData();

  try {
    await Promise.all([loadReqs(), loadNotifs()]);
  } catch (e) {
    console.warn('Не удалось загрузить данные:', e);
  }
  renderDash();
  // автообновление каждые 10 секунд
  setInterval(async () => {
    try {
      await loadReqs();
      renderDash();
      if (document.getElementById('pgReqs').style.display !== 'none') renderReqs();
    } catch (_) {}
    try {
      await loadNotifs();
      if (document.getElementById('pgNotif').style.display !== 'none') renderNotifs();
    } catch (_) {}
  }, 10000);
}

function showFatalError(msg) {
  document.querySelector('.ct').innerHTML = `
    <div style="max-width:520px;margin:60px auto;padding:32px;background:#101828;border:0.5px solid rgba(239,68,68,.3);border-radius:16px;text-align:center">
      <div style="font-size:40px;margin-bottom:16px">⚠️</div>
      <h2 style="font-family:'Syne',sans-serif;font-size:20px;margin-bottom:12px;color:#F1F5F9">Ошибка подключения</h2>
      <p style="font-size:14px;color:#94A3B8;line-height:1.7;margin-bottom:24px">${msg}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button onclick="location.reload()" style="padding:10px 20px;background:#3B82F6;color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer">Обновить</button>
        <button onclick="location.href='index.html'" style="padding:10px 20px;background:transparent;border:0.5px solid rgba(255,255,255,.2);color:#94A3B8;border-radius:10px;font-size:14px;cursor:pointer">На главную</button>
      </div>
    </div>`;
}

async function logout() {
  try {
    await fetch('api/auth.php?action=logout', { method: 'POST', credentials: 'same-origin' });
  } catch (_) {}
  location.href = 'index.html';
}

// Запуск
boot();
</script>
</body>
</html>
