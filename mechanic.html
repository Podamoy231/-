<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AutoPilot — Панель механика</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060A12;--sf:#0C1220;--card:#101828;--bd:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.11);--blue:#3B82F6;--bla15:rgba(59,130,246,.15);--bla08:rgba(59,130,246,.08);--txt:#F1F5F9;--sub:#94A3B8;--hint:#475569;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--orange:#F97316;--purple:#8B5CF6}
html{-webkit-font-smoothing:antialiased}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
h1,h2,h3,h4{font-family:'Syne',sans-serif}button,input,select,textarea{font-family:inherit}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(59,130,246,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.025) 1px,transparent 1px);background-size:64px 64px}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;padding:0 1.5rem;gap:14px;backdrop-filter:blur(24px);background:rgba(6,10,18,.9);border-bottom:.5px solid var(--bd)}
.logo{font-size:18px;font-weight:800;letter-spacing:-.5px;color:var(--txt);text-decoration:none}.logo em{color:var(--blue);font-style:normal}
.rtag{background:rgba(16,185,129,.1);border:.5px solid rgba(16,185,129,.3);color:#34D399;padding:4px 12px;border-radius:20px;font-size:12px}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite;display:inline-block}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.uname{font-size:14px;color:var(--sub)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#10B981,#3B82F6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:'Syne',sans-serif}
.layout{display:flex;padding-top:64px;min-height:100vh}
.sb{width:220px;border-right:.5px solid var(--bd);padding:24px 16px;position:fixed;top:64px;bottom:0;background:var(--sf);z-index:50}
.ct{flex:1;margin-left:220px;padding:32px 24px;position:relative;z-index:1}
.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--sub);transition:all .2s;margin-bottom:4px;border:none;background:none;width:100%;text-align:left}
.ni:hover{background:rgba(255,255,255,.04);color:var(--txt)}.ni.on{background:rgba(16,185,129,.1);color:var(--txt)}
.ndiv{height:.5px;background:var(--bd);margin:12px 0}
.ph{margin-bottom:28px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.ph h1{font-size:26px;font-weight:700;letter-spacing:-.5px}.ph p{font-size:14px;color:var(--sub);margin-top:6px;font-weight:300}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;margin-bottom:24px}
.sc{background:var(--sf);border:.5px solid var(--bd);border-radius:12px;padding:18px}
.sc .n{font-family:'Syne',sans-serif;font-size:28px;font-weight:700}.sc .l{font-size:12px;color:var(--hint);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:500;border:none;transition:all .2s;cursor:pointer}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:#2563EB}
.btn-g{background:transparent;border:.5px solid var(--bd2);color:var(--sub)}.btn-g:hover{border-color:var(--blue);color:var(--txt);background:var(--bla08)}
.btn-green{background:rgba(16,185,129,.15);border:.5px solid rgba(16,185,129,.3);color:#34D399}.btn-green:hover{background:rgba(16,185,129,.25)}
.btn-amber{background:rgba(245,158,11,.15);border:.5px solid rgba(245,158,11,.3);color:#FCD34D}.btn-amber:hover{background:rgba(245,158,11,.25)}
.btn-orange{background:rgba(249,115,22,.15);border:.5px solid rgba(249,115,22,.3);color:#FB923C}.btn-orange:hover{background:rgba(249,115,22,.25)}
.btn-purple{background:rgba(139,92,246,.15);border:.5px solid rgba(139,92,246,.3);color:#C4B5FD}.btn-purple:hover{background:rgba(139,92,246,.25)}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:8px}
.sbadge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500}
.s-new{background:rgba(148,163,184,.15);color:#94A3B8}.s-accepted{background:var(--bla15);color:#93C5FD}
.s-diag{background:rgba(139,92,246,.15);color:#C4B5FD}.s-repair{background:rgba(249,115,22,.15);color:#FCA5A1}
.s-done{background:rgba(16,185,129,.15);color:#6EE7B7}.s-cancelled{background:rgba(148,163,184,.1);color:#64748B}
.phi{background:rgba(239,68,68,.1);border:.5px solid rgba(239,68,68,.3);color:#F87171;padding:3px 8px;border-radius:5px;font-size:11px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.flt{padding:7px 16px;border-radius:20px;font-size:13px;cursor:pointer;border:.5px solid var(--bd2);background:transparent;color:var(--sub);font-family:'DM Sans',sans-serif;transition:all .2s}
.flt:hover{color:var(--txt)}.flt.on{background:var(--bla15);border-color:rgba(59,130,246,.4);color:var(--txt)}
.rc-wrap{display:grid;gap:16px}
.rc{background:var(--card);border:.5px solid var(--bd);border-radius:14px;padding:20px;transition:border-color .2s}
.rc:hover{border-color:var(--bd2)}
.rc-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.rc-title h3{font-size:16px;font-weight:600}.rc-title p{font-size:12px;color:var(--hint);margin-top:3px}
.rc-prob{font-size:13px;color:var(--sub);padding:12px 14px;background:rgba(255,255,255,.02);border-radius:8px;margin-bottom:14px;line-height:1.55}
.rc-info{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--hint);margin-bottom:14px}
.rc-info strong{color:var(--sub)}
.rc-div{height:.5px;background:var(--bd);margin:14px 0}
.rc-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:60px 20px}
.empty-i{font-size:52px;margin-bottom:16px;opacity:.35}
.empty h3{font-size:18px;margin-bottom:8px;color:var(--sub)}.empty p{font-size:14px;color:var(--hint)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);z-index:1000;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex;animation:fi .2s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:.5px solid var(--bd2);border-radius:20px;padding:32px;width:100%;max-width:500px;position:relative;animation:su .3s ease}
@keyframes su{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.mx{position:absolute;top:18px;right:18px;background:none;border:none;color:var(--hint);font-size:18px;padding:4px;cursor:pointer;line-height:1}
.mx:hover{color:var(--txt)}.modal h2{font-size:20px;font-weight:700;margin-bottom:20px}
.sf{display:flex;gap:8px;flex-wrap:wrap;padding:16px;background:var(--sf);border-radius:12px;margin-bottom:16px}
.sfi{flex:1;min-width:80px;padding:10px 12px;border-radius:8px;text-align:center;font-size:12px;border:.5px solid var(--bd2);color:var(--sub);transition:all .2s;cursor:pointer}
.sfi:hover{border-color:var(--blue);color:var(--txt)}.sfi.cur{background:var(--bla15);border-color:rgba(59,130,246,.4);color:var(--txt)}
.sfi-i{font-size:18px;margin-bottom:4px}
.fg{margin-bottom:14px}.fl{font-size:12px;color:var(--sub);margin-bottom:5px;display:block}
.inp{width:100%;padding:10px 13px;background:var(--sf);border:.5px solid var(--bd2);border-radius:9px;color:var(--txt);font-size:14px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--blue)}.inp::placeholder{color:var(--hint)}
textarea.inp{resize:vertical;min-height:80px}
.toast-c{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--card);border:.5px solid var(--bd2);border-radius:14px;padding:13px 18px;display:flex;align-items:center;gap:10px;font-size:14px;min-width:260px;pointer-events:auto;transform:translateX(110%);transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0}
.toast.show{transform:none;opacity:1}.toast-s{border-color:rgba(16,185,129,.35)}.toast-e{border-color:rgba(239,68,68,.35)}
@media(max-width:768px){.sb{display:none}.ct{margin-left:0}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">Auto<em>Pilot</em></a>
  <span class="rtag">🔧 Механик</span>
  <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)"><span class="ldot"></span>Live</div>
  <div class="nav-r">
    <span class="uname" id="uname"></span>
    <div class="av" id="uav"></div>
  </div>
</nav>
<div class="layout">
  <div class="sb">
    <button class="ni on" id="nAll"  onclick="showPg('all')"><span style="width:20px;text-align:center;font-size:16px">📋</span>Все заявки</button>
    <button class="ni"    id="nMine" onclick="showPg('mine')"><span style="width:20px;text-align:center;font-size:16px">⚙️</span>Мои задачи</button>
    <div class="ndiv"></div>
    <button class="ni" onclick="location.href='admin.html'"><span style="width:20px;text-align:center;font-size:16px">🛡</span>Admin</button>
    <button class="ni" onclick="logout()"><span style="width:20px;text-align:center;font-size:16px">🚪</span>Выйти</button>
  </div>
  <div class="ct">
    <div id="pgAll">
      <div class="ph">
        <div><h1>Все заявки</h1><p>Управление заявками клиентов</p></div>
        <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)"><span class="ldot"></span>Авто-обновление</div>
      </div>
      <div class="sgrid">
        <div class="sc"><div class="n" id="sT">—</div><div class="l">Всего</div></div>
        <div class="sc"><div class="n" style="color:var(--amber)" id="sN">—</div><div class="l">Новых</div></div>
        <div class="sc"><div class="n" style="color:var(--orange)" id="sA">—</div><div class="l">В работе</div></div>
        <div class="sc"><div class="n" style="color:var(--green)" id="sD">—</div><div class="l">Готово</div></div>
      </div>
      <div class="filters">
        <button class="flt on" onclick="setFlt('all',this)">Все</button>
        <button class="flt" onclick="setFlt('new',this)">🟡 Новые</button>
        <button class="flt" onclick="setFlt('accepted',this)">🔵 Принято</button>
        <button class="flt" onclick="setFlt('diag',this)">🟣 Диагностика</button>
        <button class="flt" onclick="setFlt('repair',this)">🟠 Ремонт</button>
        <button class="flt" onclick="setFlt('done',this)">🟢 Готово</button>
      </div>
      <div class="rc-wrap" id="allCards"></div>
    </div>
    <div id="pgMine" style="display:none">
      <div class="ph"><div><h1>Мои задачи</h1><p>Заявки назначенные на вас</p></div></div>
      <div class="rc-wrap" id="mineCards"></div>
    </div>
  </div>
</div>

<!-- CHANGE STATUS MODAL -->
<div class="overlay" id="stOv">
  <div class="modal">
    <button class="mx" onclick="closeOv('stOv')">✕</button>
    <h2>Изменить статус</h2>
    <div id="stContent"></div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="overlay" id="cfOv">
  <div class="modal">
    <button class="mx" onclick="closeOv('cfOv')">✕</button>
    <h2 id="cfTitle">Подтверждение</h2>
    <div class="fg"><label class="fl">Новый статус</label><div id="cfStatus" style="font-size:14px;color:var(--sub);padding:6px 0"></div></div>
    <div class="fg"><label class="fl">Комментарий (необязательно)</label><textarea class="inp" id="cfComment" placeholder="Что сделано, что найдено..."></textarea></div>
    <div class="fg"><label class="fl">Время готовности</label><input class="inp" id="cfEta" type="text" placeholder="~2 часа / сегодня до 18:00"></div>
    <div class="fg"><label class="fl">Стоимость (предварительно)</label><input class="inp" id="cfCost" type="text" placeholder="от 5 000 ₽"></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-p" style="flex:1;justify-content:center" id="cfBtn" onclick="confirmChange()">Сохранить</button>
      <button class="btn btn-g" onclick="closeOv('cfOv')">Отмена</button>
    </div>
  </div>
</div>

<div class="toast-c" id="tc"></div>

<script>
const STATUS={
  new:     {l:'Заявка создана',c:'s-new',    i:'🟡',next:'accepted',nl:'Принять авто',nc:'btn-amber'},
  accepted:{l:'Авто принято',  c:'s-accepted',i:'🔵',next:'diag',    nl:'Начать диагностику',nc:'btn-purple'},
  diag:    {l:'Диагностика',   c:'s-diag',   i:'🟣',next:'repair',   nl:'Начать ремонт',nc:'btn-orange'},
  repair:  {l:'Ремонт',        c:'s-repair', i:'🟠',next:'done',     nl:'Отметить готовым ✓',nc:'btn-green'},
  done:    {l:'Готово',        c:'s-done',   i:'🟢',next:null},
  cancelled:{l:'Отменена',     c:'s-cancelled',i:'⚪',next:null},
};
const ALL_ST=['new','accepted','diag','repair','done'];

let ME={}, reqs=[], flt='all', pending=null;

async function boot(){
  try{
    ME=await api('api/auth.php?action=me');
  }catch(e){
    if(e.message==='Не авторизован'||e.message.includes('401')){location.href='index.html';}
    else{document.querySelector('.ct').innerHTML='<div style="padding:60px;text-align:center;color:#94A3B8"><div style="font-size:40px;margin-bottom:16px">⚠️</div><p>'+e.message+'</p><button onclick="location.reload()" style="margin-top:16px;padding:10px 20px;background:#3B82F6;color:#fff;border:none;border-radius:10px;cursor:pointer">Обновить</button></div>';}
    return;
  }
  document.getElementById('uname').textContent=ME.name||'';
  document.getElementById('uav').textContent=ME.initials||'?';
  await loadReqs();
  setInterval(async()=>{ try{ await loadReqs(); render(); }catch(_){} }, 10000);
}

async function loadReqs(){
  reqs=await api('api/requests.php?action=list');
  updateStats(); render();
}

function updateStats(){
  document.getElementById('sT').textContent=reqs.length;
  document.getElementById('sN').textContent=reqs.filter(r=>r.status==='new').length;
  document.getElementById('sA').textContent=reqs.filter(r=>['accepted','diag','repair'].includes(r.status)).length;
  document.getElementById('sD').textContent=reqs.filter(r=>r.status==='done').length;
}

function setFlt(f,el){
  flt=f;
  document.querySelectorAll('.flt').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  render();
}

function render(){
  const filtered=flt==='all'?reqs:reqs.filter(r=>r.status===flt);
  renderList('allCards', filtered);
  const mine=reqs.filter(r=>r.mechanic_id==ME.id && r.status!=='done' && r.status!=='cancelled');
  renderList('mineCards', mine);
}

function renderList(elId, list){
  const el=document.getElementById(elId);
  if(!list.length){
    el.innerHTML='<div class="empty"><div class="empty-i">🗂</div><h3>Заявок нет</h3><p>По данному фильтру ничего не найдено</p></div>';
    return;
  }
  el.innerHTML=list.map(r=>renderCard(r)).join('');
}

function renderCard(r){
  const st=STATUS[r.status]||STATUS.new;
  const phi=r.priority==='high'?`<span class="phi">🔴 Срочно</span>`:'';
  const ismine=r.mechanic_id==ME.id;
  return`<div class="rc">
    <div class="rc-head">
      <div class="rc-title">
        <h3>${r.make} ${r.model} ${r.year}</h3>
        <p>#${r.number} · ${r.client_name||'—'} · ${r.preferred_date||''}</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">${phi}<div class="sbadge ${st.c}">${st.i} ${st.l}</div></div>
    </div>
    <div class="rc-prob">${r.description}</div>
    <div class="rc-info">
      <span>📞 <strong>${r.client_phone||'—'}</strong></span>
      <span>👤 <strong>${r.mechanic_name||'Не назначен'}</strong></span>
      ${r.estimated_cost?`<span>💰 <strong>${r.estimated_cost}</strong></span>`:''}
      ${r.eta?`<span>⏰ <strong>${r.eta}</strong></span>`:''}
    </div>
    <div class="rc-div"></div>
    <div class="rc-actions">
      ${st.next?`<button class="btn ${st.nc} btn-sm" onclick="quickNext(${r.id},'${st.next}','${st.nl}')">${st.nl} →</button>`:`<span style="font-size:13px;color:var(--green)">✓ Работа завершена</span>`}
      <button class="btn btn-g btn-sm" onclick="openStModal(${r.id})">Все статусы</button>
      ${!ismine&&r.status!=='done'&&r.status!=='cancelled'?`<button class="btn btn-g btn-sm" onclick="takeIt(${r.id})">Взять в работу</button>`:''}
    </div>
  </div>`;
}

function quickNext(id,newSt,label){
  const r=reqs.find(x=>x.id===id); if(!r) return;
  pending={id,newSt};
  const st=STATUS[r.status]||STATUS.new;
  document.getElementById('cfTitle').textContent='Изменить статус';
  document.getElementById('cfStatus').textContent=`${st.i} ${st.l} → ${STATUS[newSt]?.i} ${STATUS[newSt]?.l}`;
  document.getElementById('cfComment').value='';
  document.getElementById('cfEta').value=r.eta||'';
  document.getElementById('cfCost').value=r.estimated_cost||'';
  document.getElementById('cfOv').classList.add('open');
}

function openStModal(id){
  const r=reqs.find(x=>x.id===id); if(!r) return;
  document.getElementById('stContent').innerHTML=`
    <p style="font-size:14px;color:var(--sub);margin-bottom:14px">${r.make} ${r.model} · #${r.number}</p>
    <div class="sf">${ALL_ST.map(s=>{
      const sm=STATUS[s];
      return`<div class="sfi ${r.status===s?'cur':''}" onclick="selectSt(${r.id},'${s}')">
        <div class="sfi-i">${sm.i}</div><div>${sm.l}</div></div>`;
    }).join('')}</div>
    <button class="btn btn-g" style="width:100%;justify-content:center;margin-top:4px" onclick="closeOv('stOv')">Закрыть</button>`;
  document.getElementById('stOv').classList.add('open');
}

function selectSt(id,newSt){
  closeOv('stOv');
  const r=reqs.find(x=>x.id===id); if(!r) return;
  pending={id,newSt};
  const st=STATUS[r.status]||STATUS.new;
  document.getElementById('cfTitle').textContent='Изменить статус';
  document.getElementById('cfStatus').textContent=`→ ${STATUS[newSt]?.i} ${STATUS[newSt]?.l}`;
  document.getElementById('cfComment').value='';
  document.getElementById('cfEta').value=r.eta||'';
  document.getElementById('cfCost').value=r.estimated_cost||'';
  document.getElementById('cfOv').classList.add('open');
}

async function confirmChange(){
  if(!pending) return;
  const btn=document.getElementById('cfBtn');
  btn.disabled=true; btn.textContent='Сохраняем...';
  const {id,newSt}=pending;
  try{
    await api('api/requests.php?action=status',{method:'POST',body:JSON.stringify({
      id, status:newSt,
      comment:document.getElementById('cfComment').value.trim(),
      eta:document.getElementById('cfEta').value.trim(),
      estimated_cost:document.getElementById('cfCost').value.trim(),
    })});
    Toast.success('Статус обновлён: '+(STATUS[newSt]?.l||newSt));
    await loadReqs();
  }catch(e){ Toast.error(e.message); }
  finally{ btn.disabled=false; btn.textContent='Сохранить'; closeOv('cfOv'); pending=null; }
}

async function takeIt(id){
  try{
    await api('api/requests.php?action=assign',{method:'POST',body:JSON.stringify({id})});
    Toast.success('Заявка назначена на вас');
    await loadReqs();
  }catch(e){ Toast.error(e.message); }
}

function showPg(p){
  document.getElementById('pgAll').style.display=p==='all'?'block':'none';
  document.getElementById('pgMine').style.display=p==='mine'?'block':'none';
  document.getElementById('nAll').classList.toggle('on',p==='all');
  document.getElementById('nMine').classList.toggle('on',p==='mine');
  render();
}

function closeOv(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(el=>{el.addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});});
async function logout(){try{await fetch('api/auth.php?action=logout',{method:'POST',credentials:'include'});}catch(_){}location.href='index.html';}
async function api(url,opts={}){const res=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opts});if(!res.ok&&res.status===401){location.href='index.html';throw new Error('Не авторизован');}const json=await res.json();if(!json.ok)throw new Error(json.error||'Ошибка сервера');return json.data;}
const Toast={show(msg,type='s'){const c=document.getElementById('tc');const t=document.createElement('div');t.className=`toast toast-${type}`;t.innerHTML=`<span>${{s:'✓',e:'✕'}[type]||'•'}</span><span>${msg}</span>`;c.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350);},4000);},success:m=>Toast.show(m,'s'),error:m=>Toast.show(m,'e')};
boot();
</script>
